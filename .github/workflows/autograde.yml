# Runs check.py in every folder that has one (hw1/, ex02/, ...; hw0/ has none), one check per folder.
# On a push, only folders that changed are checked. "Run workflow" on the Actions tab checks all.
# Generic on purpose: this file never needs to change during the quarter.
name: Autograde
on: [push, workflow_dispatch]

jobs:
  find:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.list.outputs.folders }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          all=$(for f in */check.py; do [ -f "$f" ] && dirname "$f"; done | sort)
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qx '0*' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" HEAD | cut -d/ -f1 | sort -u)
            folders=$(comm -12 <(echo "$all") <(echo "$changed"))
          else
            folders="$all"
          fi
          echo "Checking: ${folders:-nothing}"
          echo "folders=$(printf '%s\n' $folders | jq -R 'select(length>0)' | jq -cs .)" >> "$GITHUB_OUTPUT"

  check:
    needs: find
    if: needs.find.outputs.folders != '[]'
    name: ${{ matrix.folder }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.find.outputs.folders) }}
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 check.py
